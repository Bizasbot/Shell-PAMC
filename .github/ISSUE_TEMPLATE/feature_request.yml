name: Solicitud de característica
description: Proponer una nueva capacidad o una mejora a una existente.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Las solicitudes en español son bienvenidas.

        Shell-PAMC es propietaria de la identidad, nomenclatura, organización, fachada de administración y observabilidad de uso sobre CLIProxyAPI. La adaptación de protocolos, ejecución de credenciales y proxificado de solicitudes pertenecen a [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI); [PRODUCT.md](https://github.com/Bizasbot/Shell-PAMC/blob/main/PRODUCT.md) describe el límite del sistema.
  - type: checkboxes
    id: preflight
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues existentes y no encontré ninguna solicitud previa sobre esto.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: La situación que esto mejoraría y quién se encuentra con ella. Un flujo de trabajo concreto es más útil que un control propuesto.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamiento propuesto
      description: Qué haría la consola o la API. Mencione la página, endpoint o ajuste involucrado si lo conoce.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas y soluciones temporales
      description: Otros enfoques considerados, o cómo se resuelve la necesidad actualmente.
  - type: checkboxes
    id: constraints
    attributes:
      label: Restricciones del proyecto
      description: Marque todo lo que tocaría la propuesta; esto define cómo puede construirse.
      options:
        - label: Requiere un endpoint o campo de administración de CPA que la consola no lee hoy.
        - label: Requiere acceso de red más allá del propio CPA (la consola funciona totalmente sin conexión, sin CDN).
        - label: Muestra, almacena o exporta un secreto (clave de administración, clave de proveedor, clave de cliente, token OAuth).
        - label: Debería estar disponible también para agentes como capacidad (docs/agent-capabilities.md).
  - type: dropdown
    id: contribution
    attributes:
      label: Contribución
      options:
        - Solo estoy proponiendo esto
        - Puedo ayudar a probarlo
        - Me gustaría implementarlo
    validations:
      required: true

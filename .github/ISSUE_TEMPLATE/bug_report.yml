name: Reporte de error
description: Algo en Shell-PAMC se comporta de forma incorrecta o diferente a su documentación.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Los reportes en español son bienvenidos.

        Una vulnerabilidad de seguridad no debe enviarse aquí: siga [SECURITY.md](https://github.com/Bizasbot/Shell-PAMC/blob/main/SECURITY.md) e infórmela de forma privada.
  - type: checkboxes
    id: preflight
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues existentes y no encontré ningún reporte de este problema.
          required: true
        - label: Eliminé cada clave API, clave de administración, token, archivo de autenticación y nombre de host privado del texto, registros y capturas de pantalla a continuación.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Qué ocurrió
      description: El comportamiento observado y la página o área de la consola donde aparece.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué se esperaba
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: La secuencia más corta que desencadena el problema.
      placeholder: |
        1. Abrir …
        2. Hacer clic en …
        3. Observar …
    validations:
      required: true
  - type: input
    id: omc-version
    attributes:
      label: Versión de Shell-PAMC
      description: Mostrada en la página de Información del Sistema, o el tag de imagen en uso.
      placeholder: v0.1.2
    validations:
      required: true
  - type: input
    id: cpa-version
    attributes:
      label: Versión de CLIProxyAPI
      description: Mostrada en la página de Información del Sistema. Shell-PAMC requiere CPA v8.0.0 o posterior.
      placeholder: v8.0.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Método de instalación
      description: Las secciones de docs/install.md.
      options:
        - Nueva instalación (CPA y Shell-PAMC en un archivo Compose)
        - Añadido a un archivo Compose de CPA existente
        - Contenedor independiente (Standalone)
        - Compilado desde código fuente
        - Otro (describir abajo)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Lo que aplique — SO y arquitectura del host, proxy inverso y subruta, navegador y versión, dispositivo o ancho de viewport, idioma y tema de la consola.
  - type: textarea
    id: evidence
    attributes:
      label: Registros y capturas de pantalla
      description: Registros del contenedor (`docker compose logs shell-pamc`), errores de la consola del navegador, respuestas de red fallidas o capturas de pantalla. Redacte secretos primero.

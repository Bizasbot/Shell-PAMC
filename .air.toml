# Configuración de recarga en caliente de Air: `pnpm dev:api` (solo backend) o `pnpm dev` (backend + frontend).
# El backend lee .env por sí mismo, no es necesario inyectar variables de entorno aquí. CPA no es iniciado por Air —
# ejecute `pnpm cpa:start` por su cuenta o use su propio CPA.
root = "."
testdata_dir = "tmp"
tmp_dir = "tmp/air"

[build]
  args_bin = []
  bin = "./tmp/air/main.exe"
  cmd = "go build -o ./tmp/air/main.exe ./cmd/shell-pamc"
  delay = 500
  exclude_dir = ["assets", "tmp", "cpa", "web", "docs", "deploy", "scripts", "internal/web/dist"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "sql"]
  kill_delay = "500ms"
  log = "tmp/air/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[proxy]
  enabled = false
  proxy_port = 0

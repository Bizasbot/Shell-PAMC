services:
  shell-pamc:
    image: ${SHELLPAMC_IMAGE:-ghcr.io/bizasbot/shell-pamc:latest}
    container_name: ${SHELLPAMC_CONTAINER_NAME:-shell-pamc}
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${SHELLPAMC_BIND:-127.0.0.1:8080}:8080
    environment:
      TZ: ${TZ:-UTC}
      SHELLPAMC_LISTEN_ADDR: ":8080"
      SHELLPAMC_BASE_PATH: ${SHELLPAMC_BASE_PATH:-/shell-pamc}
      SHELLPAMC_DATA_DIR: /data
      SHELLPAMC_CPA_BASE_URL: ${SHELLPAMC_CPA_BASE_URL:?set SHELLPAMC_CPA_BASE_URL}
      SHELLPAMC_CPA_USAGE_ADDR: ${SHELLPAMC_CPA_USAGE_ADDR:-}
      SHELLPAMC_CPA_MANAGEMENT_KEY: ${SHELLPAMC_CPA_MANAGEMENT_KEY:?set SHELLPAMC_CPA_MANAGEMENT_KEY}
      SHELLPAMC_MASTER_KEY: ${SHELLPAMC_MASTER_KEY:?set SHELLPAMC_MASTER_KEY}
      SHELLPAMC_PUBLIC_URL: ${SHELLPAMC_PUBLIC_URL:-http://127.0.0.1:8080}
      SHELLPAMC_TRUSTED_PROXY_CIDRS: ${SHELLPAMC_TRUSTED_PROXY_CIDRS:-}
      SHELLPAMC_USAGE_INGEST_MODE: ${SHELLPAMC_USAGE_INGEST_MODE:-auto}
      SHELLPAMC_UPDATE_CHECK_ENABLED: ${SHELLPAMC_UPDATE_CHECK_ENABLED:-true}
      SHELLPAMC_UPDATE_CHECK_ON_PAGE_LOAD: ${SHELLPAMC_UPDATE_CHECK_ON_PAGE_LOAD:-true}
    volumes:
      - ${SHELLPAMC_DATA_PATH:-../shell-pamc-data}:/data
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway

  # Applies the updates the console's System Information page offers. It holds the Docker
  # socket, which is control of this host's Docker. To update by hand instead, delete
  # this service and run `docker rm -f shell-pamc-updater`: Compose leaves the container
  # of a deleted service running (docs/install.md, "Upgrading").
  shell-pamc-updater:
    image: ${SHELLPAMC_IMAGE:-ghcr.io/bizasbot/shell-pamc:latest}
    container_name: ${SHELLPAMC_UPDATER_CONTAINER_NAME:-shell-pamc-updater}
    command: ["updater", "serve"]
    # The socket belongs to root on the host; with every capability dropped this is root
    # that can open the socket and nothing else.
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
networks:
  default:
    name: ${SHELLPAMC_NETWORK_NAME:-shell-pamc-standalone}
    external: ${SHELLPAMC_NETWORK_EXTERNAL:-false}
